<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Android icon</title>
  <defs>
    <!-- Eyes are cut out so the icon is fully transparent behind them -->
    <mask id="eyes">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="212" cy="214" r="10" fill="#000"/>
      <circle cx="300" cy="214" r="10" fill="#000"/>
    </mask>
  </defs>

  <g fill="#3DDC84" mask="url(#eyes)">
    <!-- Head -->
    <path d="M136 262a120 120 0 0 1 240 0z"/>
    <!-- Body -->
    <path d="M136 280h240v100a24 24 0 0 1-24 24H160a24 24 0 0 1-24-24z"/>
    <!-- Arms -->
    <rect x="98" y="280" width="26" height="96" rx="13"/>
    <rect x="388" y="280" width="26" height="96" rx="13"/>
    <!-- Legs -->
    <rect x="182" y="388" width="28" height="64" rx="14"/>
    <rect x="302" y="388" width="28" height="64" rx="14"/>
  </g>

  <!-- Antennae -->
  <g stroke="#3DDC84" stroke-width="12" stroke-linecap="round">
    <line x1="194" y1="160" x2="170" y2="118"/>
    <line x1="318" y1="160" x2="342" y2="118"/>
  </g>
</svg>
